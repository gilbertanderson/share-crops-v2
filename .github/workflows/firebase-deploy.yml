name: Firebase deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  firebase-hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --include=dev

      - name: Firebase prebuild + SPA build
        run: node scripts/firebase-prebuild.mjs && npm run build
        env:
          CI: true
          # Public Firebase web SDK config (same as netlify.toml).
          VITE_FIREBASE_API_KEY: AIzaSyCEI7ej1xjvuv7BPfTo8GbSnPCkULiKjIU
          VITE_FIREBASE_AUTH_DOMAIN: share-crops-app.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: share-crops-app
          VITE_FIREBASE_STORAGE_BUCKET: share-crops-app.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "764953465643"
          VITE_FIREBASE_APP_ID: 1:764953465643:web:9433426e334aed02a4eb6e
          VITE_FALLBACK_API_URL: https://share-crops-marketplace.vercel.app/api/make-server-dd877831

      - name: Verify publish output
        run: test -f dist/index.html

      - name: Deploy Hosting + Auth config
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "Deploying with FIREBASE_TOKEN…"
            npx -y firebase-tools@latest deploy \
              --only hosting,auth \
              --project share-crops-app \
              --non-interactive \
              --token "$FIREBASE_TOKEN"
          elif [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "Deploying with FIREBASE_SERVICE_ACCOUNT…"
            sa_file="${RUNNER_TEMP}/firebase-sa.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$sa_file"
            export GOOGLE_APPLICATION_CREDENTIALS="$sa_file"
            npx -y firebase-tools@latest deploy \
              --only hosting,auth \
              --project share-crops-app \
              --non-interactive
          else
            echo "::error::Firebase Hosting was not deployed — no GitHub Actions secret is configured."
            echo "::error::Add FIREBASE_TOKEN (recommended: run \`npx firebase-tools login:ci\`) or FIREBASE_SERVICE_ACCOUNT to Settings → Secrets and variables → Actions. See DEPLOY.md §7."
            exit 1
          fi
