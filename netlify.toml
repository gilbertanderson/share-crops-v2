# Share Crops v2 — Netlify static SPA deploy.
[build]
  command = "npm install --include=dev && npm run build"
  publish = "dist"

  [build.environment]
    NODE_VERSION = "22"
    # Firebase B64 + NETLIFY_INJECT_FIREBASE=true belong in Netlify UI when scan is off.
    # Placeholder keys are used by default so preview deploys pass secret scanning.
    VITE_FALLBACK_API_URL = "https://share-crops-marketplace.vercel.app/api/make-server-dd877831"
    SECRETS_SCAN_OMIT_PATHS = "api,dist,node_modules"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
