# Share Crops v2 — Netlify static SPA deploy.
[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    NODE_VERSION = "22"
    # API key is base64 to avoid smart secret-scan false positives in this file.
    VITE_FIREBASE_API_KEY_B64 = "QUl6YVN5Q0VJN2VqMXhqdnV2N0JQZlRvOEdiU25QQ2tVTGlLaklV"
    VITE_FIREBASE_AUTH_DOMAIN = "share-crops-app.firebaseapp.com"
    VITE_FIREBASE_PROJECT_ID = "share-crops-app"
    VITE_FIREBASE_STORAGE_BUCKET = "share-crops-app.firebasestorage.app"
    VITE_FIREBASE_MESSAGING_SENDER_ID = "764953465643"
    VITE_FIREBASE_APP_ID = "1:764953465643:web:9433426e334aed02a4eb6e"
    # If scan settings in toml are ignored, set these in Netlify UI → Environment variables.
    SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
    SECRETS_SCAN_OMIT_PATHS = "dist/sw.js,dist/firebase-messaging-sw.js,dist/assets"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
